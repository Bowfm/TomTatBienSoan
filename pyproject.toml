[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tomtat"
version = "1.0.0"
description = "Công cụ tự động hóa quy trình Tóm tắt - Biên soạn văn bản tiếng Việt dùng Gemini API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=3.4.0",
    "python-docx>=1.1",
    "flask>=3.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.scripts]
tomtat = "tomtat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
