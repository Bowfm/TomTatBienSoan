# =====================================================================
# Cấu hình công cụ tomtat. Mọi ngưỡng và hằng số nằm ở đây.
# File phải lưu bằng UTF-8.
# =====================================================================

paths:                        # đường dẫn tương đối tính từ thư mục dự án
  input: input
  output: output
  work: work
  prompts: prompts
  report: output/baocao.xlsx

# ---------------- Gemini: Chế độ Miễn Phí Tối Ưu (Free Tier 100%, 0 đồng) ----------------
# Tự động ưu tiên model chất lượng cao nhất trước; khi hết 20 lượt/ngày sẽ tự trượt xuống model tiếp theo
gemini:
  model: gemini-4-hydrogen        # Cấp 1 (Chất lượng cao nhất Free Tier): Gemini 4 Hydrogen (20 RPD, 5 RPM)
  fallback_models:                # Tự động trượt xuống model dưới khi chạm hạn mức ngày hoặc bận:
    - gemini-3.8-flash            # Cấp 2: Gemini 3.8 Flash (20 RPD, 5 RPM)
    - gemini-3.6-flash            # Cấp 3: Gemini 3.6 Flash (20 RPD, 5 RPM)
    - gemini-2.5-flash            # Cấp 4: Gemini 2.5 Flash (20 RPD, 5 RPM)
    - gemini-3.5-flash-lite       # Cấp 5 (Chủ lực cày số lượng): Gemini 3.5 Flash Lite (500 RPD, 15 RPM)
    - gemini-3.1-flash-lite       # Cấp 6 (Dự phòng số lượng): Gemini 3.1 Flash Lite (500 RPD, 15 RPM)
    - gemini-2.5-flash-lite       # Cấp 7: Gemini 2.5 Flash Lite (20 RPD, 10 RPM)
  timeout_s: 90                   # timeout mỗi lượt gọi (giây)
  max_retries: 2
  backoff_base_s: 2
  backoff_max_s: 10
  max_output_tokens: 16384
  temperature: null               # null = để mặc định của model
  max_concurrent_calls: 6         # hỗ trợ tới 6 luồng gọi song song trên pool 20 keys

workers: 4                        # xử lý 4 file song song cùng lúc siêu nhanh trên pool 20 keys

# ---------------- Đếm từ ----------------
word_count:
  # whitespace_alnum: đếm token tách bằng khoảng trắng có >= 1 chữ/số (gần với đếm âm tiết)
  mode: whitespace_alnum

# ---------------- Tách câu ----------------
sentence_split:
  # Từ viết tắt (viết thường, không có dấu chấm): dấu chấm sau chúng không kết thúc câu.
  abbreviations: [tp, ts, pgs, gs, ths, th, bs, ks, cn, tt, tx, q, p, đ, nxb, vd, tr, st,
                  ncs, mr, mrs, ms, dr, no, đc, ubnd, hđnd, sđd, tlđd]
  # Từ dẫn đề mục: "Điều 5. Tên điều" không bị tách sau "5."
  heading_words: [điều, chương, mục, phần, khoản, bài, tiết, phụ lục]

# ---------------- Ngưỡng chấm (tham khảo) ----------------
grading:
  rouge2_min: 0.33
  bartscore_min: -2.56
  geval_min: 4.25
  edit_min: 0.10
  compress_min: 0.10
  compress_max: 0.50
  p_required: 1.0

# ---------------- Trích chọn ----------------
extract:
  target: 0.33                # tỉ lệ nhắm tới (~33%, nâng nhẹ từ 0.30 để trích chọn nhiều từ hơn)
  target_low: 0.20            # khoảng an toàn; ngoài khoảng này -> thử lại / cảnh báo
  target_high: 0.45           # biên trên khoảng an toàn (chỉnh từ 0.40 lên 0.45 theo yêu cầu)
  max_attempts: 3             # số lần gọi AI tối đa cho bước trích chọn

# ---------------- Biên soạn ----------------
abstract:
  ratio_limit: 0.70           # quy tắc 70%: B/T <= 0,70 (ngắn hơn) hoặc T/B <= 0,70 (dài hơn)
  short_target_low: 0.55      # khi viết ngắn hơn: nhắm B/T trong [0,55; 0,68]
  short_target_high: 0.68
  long_target_factor: 1.55    # khi viết dài hơn: nhắm B ~ T * 1,55 (tối thiểu T / 0,70)
  allow_longer_below_words: 80  # chỉ cho phép viết dài hơn khi bản trích chọn < 80 từ
  too_short_warn: 0.40        # B/T < 0,40 -> cảnh báo quá ngắn
  max_attempts: 3             # số lần gọi AI tối đa cho bước biên soạn
  coverage_warn: 0.35         # tỉ lệ cặp từ của bản biên soạn có trong bản gốc < 0,35 -> cảnh báo
  # Mã cảnh báo vẫn kích hoạt thử lại và được gửi cho model
  retry_on_warnings: [number_missing, decimal_point_suspect]

# ---------------- Nhãn ----------------
label:
  ok_confidence: [cao]        # mức chắc chắn khác các giá trị này -> cờ "cần xem kỹ nhãn"

# ---------------- Chấm G-Eval tự động ----------------
judge:
  enabled: false               # Tắt trên Free Tier để tiết kiệm lượt gọi API (vẫn có điểm ước lượng cơ học trên giao diện)
  min_average: 4.25
  rewrite_once_if_below: false

# ---------------- Bố cục file ----------------
layout:
  check_filename_convention: true   # M... = đa văn bản (>= 2), S... = đơn văn bản (= 1)
  on_mismatch: stop                 # stop: dừng, đánh dấu cần xử lý tay | continue: chạy tiếp nhưng cảnh báo

# ---------------- Giao diện duyệt ----------------
review:
  host: 127.0.0.1
  port: 8765
  open_browser: true
