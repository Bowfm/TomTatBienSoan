# =====================================================================
# Cấu hình công cụ tomtat. Mọi ngưỡng và hằng số nằm ở đây.
# File phải lưu bằng UTF-8.
# =====================================================================

paths:                        # đường dẫn tương đối tính từ thư mục dự án
  input: input
  output: output
  work: work
  prompts: prompts
  report: output/baocao.xlsx

# ---------------- Gemini: Chế độ Miễn Phí Tối Ưu (Free Tier 100%, 0 đồng) ----------------
# Tự động ưu tiên model chất lượng cao nhất trước; khi hết 20 lượt/ngày sẽ tự trượt xuống model tiếp theo
gemini:
  model: gemini-4-hydrogen        # Cấp 1 (Chất lượng cao nhất Free Tier): Gemini 4 Hydrogen (20 RPD, 5 RPM)
  fallback_models:                # Tự động trượt xuống model dưới khi chạm hạn mức ngày hoặc bận:
    - gemini-3.8-flash            # Cấp 2: Gemini 3.8 Flash (20 RPD, 5 RPM)
    - gemini-3.6-flash            # Cấp 3: Gemini 3.6 Flash (20 RPD, 5 RPM)
    - gemini-3.5-flash-lite       # Cấp 4 (Chủ lực cày số lượng): Gemini 3.5 Flash Lite (500 RPD, 15 RPM)
    - gemini-3.1-flash-lite       # Cấp 5 (Dự phòng số lượng): Gemini 3.1 Flash Lite (500 RPD, 15 RPM)
  model_by_step:                  # Cho phép tách model riêng theo bước (judge dùng Flash-Lite 500 RPD/key để giữ quota 20 RPD cho biên soạn)
    judge: gemini-3.5-flash-lite
  fallback_models_by_step:        # Chuỗi dự phòng riêng theo bước (nếu không khai báo sẽ tự cắt từ chuỗi chính)
    judge:
      - gemini-3.1-flash-lite
  rpd_limits:                     # Giới hạn số requests/ngày (RPD) trên mỗi API key của từng model:
    gemini-4-hydrogen: 20
    gemini-3.8-flash: 20
    gemini-3.6-flash: 20
    gemini-3.5-flash-lite: 500
    gemini-3.1-flash-lite: 500
  rpm_limits:                     # Giới hạn số requests/phút (RPM) trên mỗi API key của từng model:
    gemini-4-hydrogen: 5
    gemini-3.8-flash: 5
    gemini-3.6-flash: 5
    gemini-3.5-flash-lite: 15
    gemini-3.1-flash-lite: 15
  min_interval_s:                 # Khoảng cách tối thiểu (giây) giữa 2 lần gọi API trên cùng 1 key (tránh tràn RPM):
    gemini-4-hydrogen: 13.0       # 5 RPM -> mỗi lần gọi trên cùng 1 key cách nhau ít nhất 13 giây
    gemini-3.8-flash: 13.0        # 5 RPM -> mỗi lần gọi trên cùng 1 key cách nhau ít nhất 13 giây
    gemini-3.6-flash: 13.0        # 5 RPM -> mỗi lần gọi trên cùng 1 key cách nhau ít nhất 13 giây
    gemini-3.5-flash-lite: 4.5    # 15 RPM -> mỗi lần gọi trên cùng 1 key cách nhau ít nhất 4.5 giây
    gemini-3.1-flash-lite: 4.5    # 15 RPM -> mỗi lần gọi trên cùng 1 key cách nhau ít nhất 4.5 giây
  timeout_s: 300                  # Trần timeout an toàn mặc định (giây) cho model chưa khai báo riêng (đặt null để tắt hẳn read timeout)
  timeout_s_by_model:             # Trần an toàn rất rộng theo từng model: đủ lâu để không cắt ngang mất RPD, nhưng vẫn thoát luồng nếu socket treo câm
    gemini-4-hydrogen: 600        # Tối đa 10 phút
    gemini-3.8-flash: 420         # Tối đa 7 phút
    gemini-3.6-flash: 360         # Tối đa 6 phút
    gemini-3.5-flash-lite: 180    # Tối đa 3 phút
    gemini-3.1-flash-lite: 180    # Tối đa 3 phút
  max_timeouts_per_model: 2       # tối đa số lần lỗi timeout mạng/server trên cùng 1 model trước khi trượt model kế tiếp (0 = không giới hạn)
  background_execution: auto      # "auto": tự dùng chạy nền (background=True, store=True) khi timeout >= background_min_timeout_s hoặc null để tránh trần 600s đồng bộ (504 deadline_exceeded) của Google
  background_min_timeout_s: 540   # ngưỡng timeout (giây) tự chuyển sang thực thi nền thay vì giữ HTTP đồng bộ dễ đứt ở 600s
  background_poll_interval_s: 3.0 # chu kỳ thăm dò kết quả khi chạy nền (giây)
  model_timeout_outage_threshold: 2   # số lần timeout/504 liên tiếp trên cùng 1 model để tạm hạ nhiệt model cho cả pool luồng
  model_timeout_outage_cooldown_s: 180 # thời gian tạm hạ nhiệt model đang treo timeout/504 (giây) trước khi thử thăm dò lại
  max_transient_per_model: 8      # tối đa số lần lỗi 503/tạm thời liên tiếp trên cùng 1 model cho mỗi lượt gọi trước khi tạm trượt model kế tiếp (tiết kiệm RPD khi model chính nghẽn; 0 = không giới hạn)
  model_outage_threshold: 5       # số lỗi 503 liên tiếp trên toàn pool để tạm hạ nhiệt model cho cả 3 luồng (tránh nối đuôi đốt RPD)
  model_outage_cooldown_s: 30     # thời gian tạm hạ nhiệt model đang bão 503 (giây) trước khi thử thăm dò lại
  global_min_dispatch_interval_s: 1.5  # giãn nhịp tối thiểu (giây) giữa mọi lượt gửi API trên toàn bộ các luồng (chống burst đồng thời gây 429 QPS)
  qps_global_cooldown_s: 15       # thời gian hạ nhiệt cổng chung (giây) khi bất kỳ luồng nào gặp 429 QPS payload gần giống nhau
  max_retries: 2
  backoff_base_s: 2
  backoff_max_s: 10
  max_output_tokens: 65536        # Gồm CẢ thinking + output tokens; 65536 là trần synchronous của Gemini 3.x/4.x (16384 dễ bị cắt khi thinking dài)
  temperature: null               # null = để mặc định của model
  thinking_level:                 # Mức suy nghĩ đồng bộ cho các model chính Gemini 3.x / 4.x (4-hydrogen, 3.8-flash, 3.6-flash); không tự ép lên *-lite
    label: medium                 # Gán nhãn phong cách ở mức medium đồng đều cho cả chuỗi model chính
    extract: medium               # Chọn ID câu ở mức medium để không tụt chất lượng chọn ý khi đổi model
    abstract: medium              # Biên soạn dùng medium: cân bằng chất lượng, tránh tự đẩy sang thinking quá dài gây vượt 600s
    judge: low
  thinking_level_by_model:        # Nâng riêng bước biên soạn (abstract) trên nhóm *-lite lên low nếu phải fallback sâu; giữ judge/các bước nhẹ ở minimal
    gemini-3.5-flash-lite:
      abstract: low
    gemini-3.1-flash-lite:
      abstract: low
  max_concurrent_calls: auto      # "auto" = tự động tăng/giảm theo tổng số API keys trong api_keys.txt
  # Chiến lược gọi key TUẦN TỰ: mỗi model có 1 con trỏ, gọi lần lượt key #1 -> key cuối rồi quay vòng lại #1.
  #  - 429  -> đủ 3 lần trên cùng (key, model) mới đánh dấu hết RPD tới chu kỳ mới (15:00 VN)
  #  - 503 / 5xx -> model đang quá tải, giãn nhịp và đổi key kế tiếp; vượt ngưỡng max_transient_per_model hoặc bão 503 toàn pool thì tạm trượt sang model kế tiếp để bảo toàn RPD
  #  - Timeout -> tự nới timeout thử lại tối đa max_timeouts_per_model lần trên kết nối mới, sau đó trượt ngay sang model kế tiếp
  #  - Chỉ khi MỌI key đều hết RPD (hoặc model lỗi/quá tải liên tiếp) -> chuyển sang model kế tiếp trong fallback_models
  max_rounds_per_model: 3         # số vòng quét hết pool mà toàn bộ key đều lỗi 503/tạm thời trước khi tạm hạ model cho lượt gọi này (0 = quay vòng vô hạn)

workers: 3      # xử lý tối đa 3 file song song; có giãn nhịp toàn cục chống 429 QPS, ngắt mạch bão 503 bảo toàn RPD và pacing <= 60/min_interval_s RPM/key
max_workers: 3  # TRẦN CỨNG: giao diện / API / CLI không thể chạy quá số luồng này (kể cả khi workers: auto)

# ---------------- Đếm từ ----------------
word_count:
  # whitespace_alnum: đếm token tách bằng khoảng trắng có >= 1 chữ/số (gần với đếm âm tiết)
  mode: whitespace_alnum

# ---------------- Tách câu ----------------
sentence_split:
  # Từ viết tắt (viết thường, không có dấu chấm): dấu chấm sau chúng không kết thúc câu.
  abbreviations: [tp, ts, pgs, gs, ths, th, bs, ks, cn, tt, tx, q, p, đ, nxb, vd, tr, st,
                  ncs, mr, mrs, ms, dr, no, đc, ubnd, hđnd, sđd, tlđd]
  # Từ dẫn đề mục: "Điều 5. Tên điều" không bị tách sau "5."
  heading_words: [điều, chương, mục, phần, khoản, bài, tiết, phụ lục]

# ---------------- Ngưỡng chấm (tham khảo) ----------------
grading:
  rouge2_min: 0.33
  bartscore_min: -2.56
  geval_min: 4.25
  edit_min: 0.10
  compress_min: 0.10
  compress_max: 0.50
  p_required: 1.0

# ---------------- Trích chọn ----------------
extract:
  target: 0.33                # tỉ lệ nhắm tới (~33%, nâng nhẹ từ 0.30 để trích chọn nhiều từ hơn)
  target_low: 0.20            # khoảng an toàn; ngoài khoảng này -> thử lại / cảnh báo
  target_high: 0.45           # biên trên khoảng an toàn (chỉnh từ 0.40 lên 0.45 theo yêu cầu)
  max_attempts: 3             # số lần gọi AI tối đa cho bước trích chọn

# ---------------- Biên soạn ----------------
abstract:
  ratio_limit: 0.70           # quy tắc 70%: B/T <= 0,70 (bản biên soạn bắt buộc ngắn hơn bản trích chọn)
  short_target_low: 0.55      # nhắm B/T trong [0,55; 0,68]
  short_target_high: 0.68
  long_target_factor: 1.55    # không còn dùng (giữ lại để tương thích cấu hình cũ)
  allow_longer_below_words: 0 # 0 = luôn bắt buộc ngắn hơn bản trích chọn (B/T <= 70%)
  too_short_warn: 0.40        # B/T < 0,40 -> cảnh báo quá ngắn
  max_attempts: 3             # số lần gọi AI tối đa cho bước biên soạn
  coverage_warn: 0.35         # tỉ lệ cặp từ của bản biên soạn có trong bản gốc < 0,35 -> cảnh báo
  # Mã cảnh báo vẫn kích hoạt thử lại và được gửi cho model
  retry_on_warnings: [number_missing, decimal_point_suspect]

# ---------------- Nhãn ----------------
label:
  ok_confidence: [cao]        # mức chắc chắn khác các giá trị này -> cờ "cần xem kỹ nhãn"

# ---------------- Chấm G-Eval tự động ----------------
judge:
  enabled: true               # Tắt mặc định trên Free Tier (bật true để tự chấm bằng model_by_step.judge, vẫn có điểm ước lượng cơ học)
  only_if_checks_ok: true      # Chỉ gọi API chấm G-Eval khi bài đã vượt qua toàn bộ kiểm tra cơ học (tránh lãng phí lượt gọi)
  min_average: 4.25
  rewrite_once_if_below: false

# ---------------- Bố cục file ----------------
layout:
  check_filename_convention: true   # M... = đa văn bản (>= 2), S... = đơn văn bản (= 1)
  on_mismatch: stop                 # stop: dừng, đánh dấu cần xử lý tay | continue: chạy tiếp nhưng cảnh báo

# ---------------- Giao diện duyệt ----------------
review:
  host: 127.0.0.1
  port: 8765
  open_browser: true
